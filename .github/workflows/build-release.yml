name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ github.ref_name }} (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            args: '--bundles app,dmg'
          - platform: windows-latest
            name: windows
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Read Package Version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: 4. Extract Release Notes
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE' > /tmp/release-notes.md
          const fs = require('fs');
          const path = require('path');

          const rawVersion = (process.env.VERSION || '').trim();
          const version = rawVersion.replace(/^v/i, '');
          const candidates = [
            'RELEASE-NOTES.md',
            path.join('folio', 'RELEASE-NOTES.md'),
            '../RELEASE-NOTES.md',
          ];

          const defaultBody = 'Release notes not maintained';
          let body = defaultBody;

          const changelogPath = candidates.find((p) => fs.existsSync(p));
          if (changelogPath && version) {
            try {
              const changelog = fs.readFileSync(changelogPath, 'utf8').replace(/\r\n/g, '\n');
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              // Accepts headings like: ## v0.1.3, ## `v0.1.3`, ## 0.1.3, ## `0.1.3`
              const heading = new RegExp('^##\\s+`?v?' + escaped + '`?\\s*$', 'm');
              const match = changelog.match(heading);

              if (match) {
                const start = match.index + match[0].length;
                const rest = changelog.slice(start);
                const nextHeading = rest.search(/\n##\s+/);
                const extracted = (nextHeading === -1 ? rest : rest.slice(0, nextHeading)).trim();
                if (extracted.length > 0) {
                  body = extracted;
                  console.error(`Release notes: matched "${match[0].trim()}" in ${changelogPath}`);
                } else {
                  console.error(`Release notes: heading "${match[0].trim()}" found in ${changelogPath} but section is empty`);
                }
              } else {
                console.error(`Release notes: no heading found for version "${version}" in ${changelogPath}`);
              }
            } catch (err) {
              console.error(`Release notes: failed to read ${changelogPath}: ${err.message}`);
              body = defaultBody;
            }
          } else if (!changelogPath) {
            console.error('Release notes: RELEASE-NOTES.md not found');
          } else {
            console.error('Release notes: package version is empty');
          }

          process.stdout.write(body);
          NODE
          echo "Release notes prepared:"
          cat /tmp/release-notes.md
          DELIMITER="EOF_${RANDOM}${RANDOM}"
          {
            echo "body<<$DELIMITER"
            cat /tmp/release-notes.md
            printf '\n'
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: 5. Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 6. Setup Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.platform }}
          workspaces: src-tauri

      - name: 7. Install Frontend Dependencies
        run: npm ci

      - name: 8. Build Tauri App & Publish Release / Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'Folio v${{ steps.version.outputs.version }}'
          releaseBody: ${{ steps.release_notes.outputs.body || 'Release notes not maintained' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: 9. Sync Version Tag & Release Notes
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # Keep the version tag pointing at the commit that produced these assets.
          git tag -f "$TAG" "$GITHUB_SHA"
          for attempt in 1 2 3; do
            if git push --force origin "refs/tags/$TAG"; then
              break
            fi
            sleep 2
          done

          # tauri-action replaces same-named assets on an existing release but does
          # not update the release name/body, so sync them for same-version re-releases.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Folio v${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi