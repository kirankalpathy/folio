name: Build installers

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            bundles: dmg
          - platform: windows-latest
            name: windows
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable, macOS)
        if: matrix.name == 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (stable, Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path $cargoBin)) {
            $rustup = Join-Path $env:TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $rustup
            & $rustup -y --default-toolchain stable --profile minimal
          }
          "$cargoBin" >> $env:GITHUB_PATH
          rustup default stable
          rustup show
          cargo --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Prepare macOS artifact (dmg only)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/

      - name: Prepare Windows artifact (installer .exe only, no MSI)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer .exe not found" }
          Copy-Item $exe.FullName -Destination "release-artifacts/folio-${{ steps.version.outputs.version }}-windows-release.exe"

      - name: Upload macOS artifact
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ steps.version.outputs.version }}-macos-release
          path: release-artifacts/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ steps.version.outputs.version }}-windows-release
          path: release-artifacts/folio-${{ steps.version.outputs.version }}-windows-release.exe
          if-no-files-found: error
